<title>Soul Sword Opening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one cinematic 16:9 stage, centered, with a slim transport bar beneath it. */
:root{
  --ink:#07080f;        /* page ground: night ink */
  --panel:#11132a;      /* control surfaces */
  --line:#262a4d;       /* hairlines */
  --moon:#f3ead2;       /* primary text: moonlight ivory */
  --dim:#9a9cbc;        /* secondary text */
  --gold:#e9b44c;       /* tsuba gold accent */
  --crimson:#c71f37;    /* Masaru's scarf */
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-kanji:"Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-ui:"Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--moon);font-family:var(--f-ui);margin:0}
.app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:16px}
.frame{width:min(100%, calc((100vh - 120px) * 16 / 9));width:min(100%, calc((100dvh - 120px) * 16 / 9));min-width:min(100%, 320px);display:flex;flex-direction:column;gap:10px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden;border-radius:4px;box-shadow:0 30px 80px -30px rgba(199,31,55,.35),0 0 0 1px var(--line)}
.stage canvas{display:block;width:100%;height:100%}
.stage:fullscreen{border-radius:0;display:flex;align-items:center;justify-content:center;background:#000}
.stage:fullscreen canvas{width:min(100vw, calc(100vh * 16 / 9));height:auto;aspect-ratio:16/9}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:clamp(6px,1.4vw,14px);padding:clamp(14px,4vw,48px);background:linear-gradient(180deg,rgba(7,8,15,0) 55%,rgba(7,8,15,.85) 80%,rgba(7,8,15,.95));}
.ov[hidden]{display:none!important}
.ov-eyebrow{font-size:clamp(10px,1.2vw,13px);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ov h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(26px,5.6vw,64px);line-height:1;letter-spacing:.06em;text-wrap:balance}
.ov h1 span{font-family:var(--f-kanji);color:var(--crimson);font-size:.62em;margin-left:.4em;letter-spacing:0}
.ov-desc{margin:0;max-width:56ch;font-size:clamp(12px,1.5vw,16px);line-height:1.6;color:var(--moon);opacity:.88}
.ov-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.ov-note{font-size:clamp(10px,1.1vw,13px);color:var(--dim)}
.btn-play{appearance:none;border:0;cursor:pointer;font:700 clamp(13px,1.6vw,17px)/1 var(--f-ui);color:#1a0d02;background:linear-gradient(180deg,#ffd77d,var(--gold));padding:.85em 1.4em;border-radius:999px;display:inline-flex;align-items:center;gap:.6em;box-shadow:0 8px 30px -8px rgba(233,180,76,.7)}
.btn-play:hover{filter:brightness(1.08)}
.btn-play:focus-visible,.ctl button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
.btn-play svg{width:1em;height:1em;fill:currentColor}

.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.ctl button{appearance:none;cursor:pointer;background:transparent;color:var(--moon);border:1px solid var(--line);border-radius:7px;font:700 13px/1 var(--f-ui);padding:8px 11px;display:inline-flex;align-items:center;gap:6px}
.ctl button:hover{border-color:var(--dim)}
.ctl button[aria-pressed="false"]{color:var(--dim)}
.ctl button svg{width:14px;height:14px;fill:currentColor}
.ctl .time{font:500 13px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--dim);min-width:86px}
.ctl input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--gold);height:20px}
.caption{font-size:12px;color:var(--dim);text-align:center;margin:0}
@media (max-width:620px){ .ov-desc,.ov-note{display:none} }
</style>

<div class="app">
  <div class="frame">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Animación del opening de Soul Sword"></canvas>
      <div class="ov" id="ov">
        <div class="ov-eyebrow" id="ovEyebrow">Opening · 1:31</div>
        <h1 class="sr">Soul Sword 魂剣</h1>
        <p class="ov-desc" id="ovDesc">Masaru engarza en su katana las almas de cinco bestias elementales y se transforma para enfrentarse al Rey Oscuro.</p>
        <div class="ov-row">
          <button class="btn-play" id="bigPlay" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg><span id="bigPlayLabel">Reproducir con sonido</span></button>
          <span class="ov-note">Música y animación generadas en directo en tu navegador.</span>
        </div>
      </div>
    </div>
    <div class="ctl" role="group" aria-label="Controles">
      <button id="playBtn" type="button" aria-label="Reproducir"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M7 4.5v15l12.5-7.5z"/></svg></button>
      <span class="time" id="time">0:00 / 1:31</span>
      <input id="seek" type="range" min="0" max="91.5" step="0.01" value="0" aria-label="Posición">
      <button id="lyrBtn" type="button" aria-pressed="true">Letras</button>
      <button id="sndBtn" type="button" aria-pressed="true">Sonido</button>
      <button id="fsBtn" type="button" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm10-5h5v5h-2V6h-3zM6 15v3h3v2H4v-5zm13 0v5h-5v-2h3v-3z"/></svg></button>
    </div>
    <p class="caption">Espacio: reproducir o pausar · Arrastra la barra para saltar a cualquier escena</p>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   SOUL SWORD — opening (animación en canvas + música Web Audio)
   ============================================================ */
const TAU = Math.PI * 2;
const BPM = 160, BEAT = 60 / BPM, BAR = BEAT * 4, TOTAL_BARS = 61, TOTAL = TOTAL_BARS * BAR;
const W = 1920, H = 1080;
const DISPLAY = '"Cinzel", Georgia, serif';
const KANJI = '"Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif';
const UI = '"Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif';
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const EL = [
  { k:'fire',    kanji:'炎', name:'HOMURA',  jp:'炎竜', beast:'Dragón de fuego',        soul:'ALMA DE FUEGO',     c:'#ff4a1c', c2:'#ffd36a', dark:'#2e0802' },
  { k:'water',   kanji:'水', name:'MIZUCHI', jp:'蛟',   beast:'Serpiente de los mares', soul:'ALMA DE AGUA',      c:'#2f8bff', c2:'#c4ecff', dark:'#03153a' },
  { k:'wind',    kanji:'風', name:'HAYATE',  jp:'疾風', beast:'Halcón de la tormenta',  soul:'ALMA DE VIENTO',    c:'#3fe0a6', c2:'#e2fff2', dark:'#032419' },
  { k:'thunder', kanji:'雷', name:'RAIJŪ',   jp:'雷獣', beast:'Bestia del trueno',      soul:'ALMA DEL TRUENO',   c:'#ffd52e', c2:'#fffbe0', dark:'#241c00' },
  { k:'earth',   kanji:'土', name:'IWAGAME', jp:'岩亀', beast:'Tortuga de la montaña',  soul:'ALMA DE LA TIERRA', c:'#c98a4b', c2:'#f6dcb4', dark:'#251404' },
];
const SPIRIT = { k:'spirit', kanji:'', c:'#8fd0ff', c2:'#ffffff', dark:'#14305e' };
const GOLDEL = { k:'gold', kanji:'魂', c:'#ffc34a', c2:'#fff6dc', dark:'#3a2304' };

const LY = [
  [0,2,'魂を この剣に','Tamashii wo kono ken ni','Almas, venid a esta espada'],
  [2,4,'闇を 斬り裂け','Yami wo kirisake','¡Corta la oscuridad!'],
  [8,10,'燃え尽きた 空の下で','Moetsukita sora no shita de','Bajo un cielo hecho cenizas'],
  [10,12,'ひとり 刀を握った','Hitori katana wo nigitta','empuñé la katana, solo'],
  [12,14,'失くした声が 呼んでいる','Nakushita koe ga yonde iru','Las voces que perdí me llaman'],
  [14,16,'「まだ 終わりじゃない」と','"Mada owari janai" to','«Esto todavía no ha terminado»'],
  [16,18,'炎 水 風 雷 大地','Honoo, mizu, kaze, ikazuchi, daichi','Fuego, agua, viento, trueno, tierra'],
  [18,20,'五つの魂 宿して','Itsutsu no tamashii yadoshite','Cinco almas viven en mí'],
  [20,22,'震える指で 繋いだ','Furueru yubi de tsunaida','Las uní con dedos temblorosos'],
  [22,24,'誓いは 今も ここに','Chikai wa ima mo koko ni','y el juramento sigue aquí'],
  [24,26,'闇の王が 目を覚ます','Yami no ō ga me wo samasu','El Rey Oscuro despierta'],
  [26,28,'恐れるな 前を向け','Osoreru na, mae wo muke','No temas, mira al frente'],
  [28,30,'叫べ ソウルソード!','Sakebe, Soul Sword!','¡Grita, Soul Sword!'],
  [30,32,'魂を 刃に灯せ','Tamashii wo yaiba ni tomose','Enciende las almas en la hoja'],
  [32,34,'砕けても 立ち上がれ','Kudaketemo tachiagare','Aunque te rompas, levántate'],
  [34,36,'運命さえ 斬り裂いて','Unmei sae kirisaite','y corta hasta el destino'],
  [36,38,'燃えろ ソウルソード!','Moero, Soul Sword!','¡Arde, Soul Sword!'],
  [38,40,'千の夜を 越えてゆけ','Sen no yoru wo koete yuke','Atraviesa mil noches'],
  [40,42,'この手に 宿る光で','Kono te ni yadoru hikari de','Con la luz que vive en mis manos'],
  [42,44,'明日を 掴み取れ','Ashita wo tsukamitore','¡atrapa el mañana!'],
  [44,46,'黒き 王冠を','Kuroki ōkan wo','Esa corona negra...'],
  [46,48,'この一撃で 打ち砕け','Kono ichigeki de uchikudake','¡hazla pedazos de un solo golpe!'],
  [48,50,'全ての魂よ 力を!','Subete no tamashii yo, chikara wo!','¡Almas, dadme vuestra fuerza!'],
  [52,54,'叫べ ソウルソード!','Sakebe, Soul Sword!','¡Grita, Soul Sword!'],
  [54,56,'夜明けの 空へ','Yoake no sora e','Hacia el cielo del amanecer'],
  [56,58,'魂は 終わらない','Tamashii wa owaranai','Las almas nunca se apagan'],
];

/* ---------------- utilidades ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const eo3 = t => 1 - Math.pow(1 - t, 3);
const ei3 = t => t * t * t;
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const _hc = {};
function hexA(h, a) {
  let c = _hc[h];
  if (!c) { const n = parseInt(h.slice(1), 16); c = _hc[h] = [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  return `rgba(${c[0]},${c[1]},${c[2]},${clamp(a)})`;
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const HAS_LS = 'letterSpacing' in ctx;

function fillBG(c) { ctx.fillStyle = c; ctx.fillRect(-80, -80, W + 160, H + 160); }
function radial(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function vgrad(stops, y0 = 0, y1 = H) { const g = ctx.createLinearGradient(0, y0, 0, y1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function poly(p) { ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); }
function txt(s, x, y, size, font, fill, o = {}) {
  ctx.font = `${o.w || 800} ${size}px ${font}`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  if (HAS_LS) ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.lw || size * .08; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  if (HAS_LS) ctx.letterSpacing = '0px';
}
function vtxt(s, x, y, size, font, fill, o = {}) {
  const ch = [...s];
  ch.forEach((c, i) => txt(c, x, y + i * size * (o.lead || 1.04), size, font, fill, o));
}

/* ---------------- piezas de dibujo ---------------- */
function dust(t, n, col = '#cfd6ff', a = .5) {
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 1.31), h2 = hash(i * 2.17 + 4), h3 = hash(i * 3.7 + 9);
    const x = ((h1 * W + t * (8 + h3 * 18)) % W);
    const y = ((h2 * H - t * (6 + h1 * 14)) % H + H) % H;
    ctx.fillStyle = hexA(col, a * (.3 + .7 * (.5 + .5 * Math.sin(t * 2 + i))));
    ctx.fillRect(x, y, 1.5 + h3 * 2.5, 1.5 + h3 * 2.5);
  }
}
function stars(t, n, a = 1) {
  for (let i = 0; i < n; i++) {
    const x = hash(i * 7.1) * W, y = hash(i * 3.3 + 1) * H * .62, r = hash(i * 5.7) * 2 + .4;
    ctx.fillStyle = `rgba(255,248,230,${a * (.35 + .65 * (.5 + .5 * Math.sin(t * (1 + hash(i)) * 2 + i)))})`;
    ctx.fillRect(x, y, r, r);
  }
}
function embers(t, n, col, speed = 1, seed = 0, size = 3, a = 1) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const h1 = hash(i + seed), h2 = hash(i * 1.7 + seed + 3), h3 = hash(i * 2.3 + seed + 7);
    const life = 2 + h3 * 3, ph = ((t * speed) / life + h1) % 1;
    const x = h2 * W + Math.sin(t * 1.5 + i) * 40 * ph;
    const y = H + 20 - ph * (H + 60);
    ctx.fillStyle = hexA(col, a * Math.sin(ph * Math.PI) * .9);
    ctx.beginPath(); ctx.arc(x, y, size * (.5 + h3), 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function petals(t, n, col = '#f7bfd0', a = .85, wind = 1) {
  ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 1.9), h2 = hash(i * 2.9 + 1), h3 = hash(i * 4.1 + 2);
    const x = ((h2 * (W + 300) + t * (70 + h1 * 90) * wind) % (W + 300)) - 150 + Math.sin(t * 2 + i) * 20;
    const y = ((h3 * (H + 100) + t * (40 + h1 * 40)) % (H + 100)) - 50;
    ctx.save(); ctx.globalAlpha = a * (.5 + h3 * .5); ctx.translate(x, y); ctx.rotate(t * (1 + h1 * 2) + i);
    ctx.scale(1, .45 + .55 * Math.abs(Math.sin(t * 3 + i)));
    ctx.beginPath(); ctx.ellipse(0, 0, 9 + h1 * 5, 5, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
}
function radialLines(cx, cy, n, col, alpha, t, inner = 200, fps = 12, wmax = 46) {
  const f = Math.floor(t * fps);
  ctx.save(); ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const a = hash(i * 3.1 + f * 7.7) * TAU;
    const w = (.2 + .8 * hash(i + f * .37)) * wmax / 2400;
    const r0 = inner + hash(i * 5.3 + f) * inner * 1.2;
    ctx.globalAlpha = alpha * (.4 + .6 * hash(i + f * 1.3));
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a - w) * 2600, cy + Math.sin(a - w) * 2600);
    ctx.lineTo(cx + Math.cos(a + w) * 2600, cy + Math.sin(a + w) * 2600);
    ctx.fill();
  }
  ctx.restore();
}
function hLines(t, n, col, alpha, speed = 2600, dir = 1) {
  ctx.save(); ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 1.1), h2 = hash(i * 2.2 + 3), h3 = hash(i * 3.3 + 5);
    const L = 200 + h2 * 700;
    let x = ((h1 * (W + L) + t * speed * (.6 + h3)) % (W + L)) - L;
    if (dir < 0) x = W - x - L;
    ctx.globalAlpha = alpha * (.3 + .7 * h3);
    ctx.fillRect(x, h3 * H, L, 1.5 + h2 * 4);
  }
  ctx.restore();
}
function ridgeN(x, s) { return Math.sin(x * .003 + s) * .5 + Math.sin(x * .0073 + s * 2) * .25 + Math.sin(x * .017 + s * 3) * .12 + Math.abs(Math.sin(x * .0017 + s)) * .5; }
function ridge(y0, amp, seed, col, off) {
  ctx.beginPath(); ctx.moveTo(-80, H + 80);
  for (let x = -80; x <= W + 80; x += 16) ctx.lineTo(x, y0 - amp * ridgeN(x + off, seed));
  ctx.lineTo(W + 80, H + 80); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
const ridgeY = (x, y0, amp, seed, off) => y0 - amp * ridgeN(x + off, seed);

function roofPath(cx, y, w, h) {
  ctx.beginPath();
  ctx.moveTo(cx - w * .62, y - h * .4);
  ctx.quadraticCurveTo(cx - w * .5, y + h * .08, cx - w * .3, y);
  ctx.lineTo(cx + w * .3, y);
  ctx.quadraticCurveTo(cx + w * .5, y + h * .08, cx + w * .62, y - h * .4);
  ctx.quadraticCurveTo(cx + w * .35, y - h * .45, cx + w * .15, y - h);
  ctx.lineTo(cx - w * .15, y - h);
  ctx.quadraticCurveTo(cx - w * .35, y - h * .45, cx - w * .62, y - h * .4);
  ctx.closePath(); ctx.fill();
}
function pagoda(cx, by, w, tiers, col, win, spire = .45) {
  ctx.fillStyle = col;
  let y = by, ww = w;
  const wins = [];
  ctx.fillRect(cx - w * .4, by, w * .8, 120);
  for (let i = 0; i < tiers; i++) {
    const bh = ww * .3;
    ctx.fillRect(cx - ww * .34, y - bh, ww * .68, bh + 2);
    wins.push([cx, y - bh * .5, ww]);
    y -= bh;
    roofPath(cx, y + ww * .04, ww, ww * .26);
    y -= ww * .2; ww *= .8;
  }
  ctx.fillRect(cx - 3, y - w * spire, 6, w * spire + 4);
  if (win) {
    ctx.fillStyle = win;
    for (const [x, yy, ww2] of wins) for (let k = -1; k <= 1; k++) ctx.fillRect(x + k * ww2 * .18 - 4, yy - 6, 8, 12);
  }
}
function tower(cx, by, w, h, col, win) {
  ctx.fillStyle = col;
  ctx.fillRect(cx - w / 2, by - h, w, h + 120);
  ctx.beginPath(); ctx.moveTo(cx - w * .68, by - h); ctx.lineTo(cx, by - h - w * 1.7); ctx.lineTo(cx + w * .68, by - h); ctx.closePath(); ctx.fill();
  ctx.fillRect(cx - 1.5, by - h - w * 2.3, 3, w * .7);
  ctx.beginPath(); ctx.moveTo(cx + 1.5, by - h - w * 2.3); ctx.lineTo(cx + w * .5, by - h - w * 2.15); ctx.lineTo(cx + 1.5, by - h - w * 2.0); ctx.fill();
  if (win) { ctx.fillStyle = win; ctx.fillRect(cx - 4, by - h * .7, 8, 14); ctx.fillRect(cx - 4, by - h * .4, 8, 14); }
}
function castle(cx, by, s, col, win) {
  tower(cx - s * .95, by, s * .17, s * .62, col, win);
  tower(cx + s * .95, by, s * .17, s * .7, col, win);
  tower(cx - s * .5, by - s * .1, s * .13, s * .62, col, win);
  tower(cx + s * .5, by - s * .1, s * .13, s * .55, col, win);
  ctx.fillStyle = col;
  ctx.fillRect(cx - s, by - s * .32, s * 2, s * .32 + 120);
  for (let i = 0; i < 20; i++) ctx.fillRect(cx - s + i * s * .1, by - s * .36, s * .05, s * .05);
  pagoda(cx, by - s * .3, s * .72, 3, col, win, .5);
}
function torii(x, by, s, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x - s * .42, by - s, s * .08, s + 40);
  ctx.fillRect(x + s * .34, by - s, s * .08, s + 40);
  ctx.fillRect(x - s * .56, by - s * .8, s * 1.12, s * .06);
  ctx.beginPath();
  ctx.moveTo(x - s * .72, by - s * 1.04);
